name: Python checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check Python and shell syntax
        run: |
          python -m compileall -q dashboard.py agent.py metrics.py python-display tests
          bash -n python-display/start-native.sh python-display/autostart.sh python-display/autostart-launch.sh start-agent.sh
      - name: Run unit and loopback agent tests
        run: python -m unittest discover -s tests -v
