name: Publish NodeWatch v0.1.0 beta

on:
  push:
    branches: [main]
    paths:
      - 'releases/v0.1.0.md'
      - '.github/workflows/publish-v0.1.0.yml'

permissions:
  contents: read

concurrency:
  group: release-v0.1.0
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Verify browser frontend is removed
        run: |
          test ! -d browser
          test ! -d static
          test ! -e kiosk-start.sh
          test ! -e start.sh

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Publish first beta release if it does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v0.1.0 \
            --target "$GITHUB_SHA" \
            --title "NodeWatch v0.1.0 — Tkinter Pi Edition" \
            --notes-file releases/v0.1.0.md \
            --prerelease
