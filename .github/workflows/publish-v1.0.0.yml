name: Publish NodeWatch v1.0.0 stable

on:
  push:
    branches: [main]
    paths:
      - 'releases/v1.0.0.md'
      - '.github/workflows/publish-v1.0.0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodewatch-publish-v1.0.0
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'harrydavies1/NodeWatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: |
          python -m compileall -q dashboard.py agent.py metrics.py python-display deploy tests
          bash -n python-display/start-native.sh python-display/autostart.sh python-display/autostart-launch.sh start-agent.sh deploy/server-agent-autostart.sh
      - name: Run NodeWatch tests
        run: python -m unittest discover -s tests -v
      - name: Check stable release notes are present
        run: |
          test -s releases/v1.0.0.md
          test -s CHANGELOG.md

  publish:
    needs: verify
    if: github.repository == 'harrydavies1/NodeWatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout stable release source
        uses: actions/checkout@v4
      - name: Create stable v1.0.0 release (never overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 is already released; leaving it unchanged."
            exit 0
          fi
          if git ls-remote --tags origin refs/tags/v1.0.0 | grep -q 'refs/tags/v1.0.0'; then
            echo "Tag v1.0.0 already exists without a release; refusing to publish an unexpected tag."
            exit 1
          fi
          gh release create v1.0.0 \
            --target "$GITHUB_SHA" \
            --title "NodeWatch v1.0.0 — First Stable Release" \
            --notes-file releases/v1.0.0.md \
            --latest
